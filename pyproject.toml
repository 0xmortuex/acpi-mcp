[project]
name = "acpi-mcp"
version = "0.1.0"
description = "MCP server that reads ACPI tables from a live QEMU guest or table files and explains them for OS developers: CPUs, I/O APICs, IRQ overrides, HPET, ECAM, shutdown and reset."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    # PyPI rejects direct git references: switch to "gdbstub-mcp>=0.1.0" once
    # gdbstub-mcp is published, before publishing acpi-mcp.
    "gdbstub-mcp @ git+https://github.com/0xmortuex/gdbstub-mcp",
]
keywords = ["mcp", "acpi", "osdev", "qemu", "madt", "fadt", "kernel", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Operating System Kernels",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/acpi-mcp"

[project.scripts]
acpi-mcp = "acpi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# gdbstub-mcp is installed from git until it's on PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/acpi_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
# gdbstub-mcp 0.1.0 ships no py.typed marker yet.
module = ["gdbstub_mcp.*"]
ignore_missing_imports = true
follow_untyped_imports = true
